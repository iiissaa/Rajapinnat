<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Nimiarvio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f5f5f5;
      border-radius: 8px;
    }
    h1 {
      color: #333;
    }
    input {
      padding: 10px;
      font-size: 16px;
      width: 70%;
      margin-right: 10px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #results {
      margin-top: 30px;
      background-color: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    ul {
      list-style: none;
      padding-left: 0;
    }
  </style>
</head>
<body>
  <h1>Arvaa sukupuoli ja kansallisuus</h1>

  <form id="nameForm">
    <input type="text" id="nameInput" placeholder="Kirjoita nimi" required />
    <button type="submit">Hae</button>
  </form>

  <div id="results"></div>

  <script>
    document.getElementById('nameForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const name = document.getElementById('nameInput').value.trim();
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '<p>Haetaan tietoja...</p>';

      try {
        const genderRes = await fetch(`https://api.genderize.io?name=${name}`);
        const nationalityRes = await fetch(`https://api.nationalize.io?name=${name}`);
        const genderData = await genderRes.json();
        const nationalityData = await nationalityRes.json();

        const sukupuoli = genderData.gender ? genderData.gender : 'Tuntematon';
        const sukupuoliProsentti = (genderData.probability * 100).toFixed(1);
        let kansallisuusHTML = '<ul>';
        if (nationalityData.country.length === 0) {
          kansallisuusHTML += '<li>Ei tietoa kansallisuuksista</li>';
        } else {
          nationalityData.country.forEach(c => {
            kansallisuusHTML += `<li>${c.country_id} – ${(c.probability * 100).toFixed(1)}%</li>`;
          });
        }
        kansallisuusHTML += '</ul>';

        resultsDiv.innerHTML = `
          <h2>Tulokset nimelle: ${name}</h2>
          <p><strong>Sukupuoli:</strong> ${sukupuoli} (${sukupuoliProsentti}%)</p>
          <h3>Kansallisuusarviot:</h3>
          ${kansallisuusHTML}
        `;
      } catch (err) {
        resultsDiv.innerHTML = '<p>Tietojen hakeminen epäonnistui</p>';
        console.error(err);
      }
    });
  </script>
</body>
</html>
